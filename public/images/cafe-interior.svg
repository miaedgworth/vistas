<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img">
  <defs><filter id="g"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5B3FA0"/><stop offset="52%" stop-color="#E9A6C6"/>
      <stop offset="70%" stop-color="#F58A3C"/><stop offset="100%" stop-color="#8FB3DA"/>
    </linearGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5DEB8" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#F5DEB8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="600" fill="#F3E4CE"/>
  <rect x="0" y="0" width="560" height="420" fill="#D9AE76"/><rect x="62.2" y="0" width="32.4" height="420" fill="#B98B58"/><rect x="186.7" y="0" width="32.4" height="420" fill="#B98B58"/><rect x="311.1" y="0" width="32.4" height="420" fill="#B98B58"/><rect x="435.6" y="0" width="32.4" height="420" fill="#B98B58"/>
  <rect x="0" y="418" width="900" height="182" fill="#EFDCC0"/>

  <!-- window with sunset -->
  <rect x="586" y="54" width="286" height="366" rx="10" fill="url(#win)"/>
  <circle cx="729" cy="292" r="46" fill="#E8A33D"/>
  <path d="M586,338 q35.75,-16 71.5,0 t71.5,0 t71.5,0 t71.5,0 L872,420 L586,420 Z" fill="#8FB3DA" opacity="0.85"/>
  <path d="M586,372 q35.75,-16 71.5,0 t71.5,0 t71.5,0 t71.5,0 L872,420 L586,420 Z" fill="#8FC1A7" opacity="0.8"/>
  <rect x="586" y="54" width="286" height="366" rx="10" fill="none" stroke="#2A4E5A" stroke-width="9"/>
  <line x1="729" y1="54" x2="729" y2="420" stroke="#2A4E5A" stroke-width="7"/>

  <!-- light shafts -->
  <path d="M586,120 L300,430 L188,430 L586,64 Z" fill="url(#shaft)"/>
  <path d="M586,250 L392,430 L318,430 L586,196 Z" fill="url(#shaft)" opacity="0.6"/>

  <!-- table + rattan chairs -->
  <ellipse cx="330" cy="470" rx="150" ry="34" fill="#C9A06A"/>
  <ellipse cx="330" cy="462" rx="150" ry="34" fill="#E3C79E" stroke="#2A4E5A" stroke-width="6"/>
  <rect x="322" y="486" width="16" height="80" fill="#2A4E5A"/>
  <path d="M286,566 h88" stroke="#2A4E5A" stroke-width="12" stroke-linecap="round"/>

  <!-- rattan chairs: rounded cane backs -->
  <g>
    <path d="M116,470 v-58 a58,58 0 0 1 116,0 v58 z" fill="#EBD3AC" stroke="#2A4E5A" stroke-width="6"/>
    <g fill="none" stroke="#2A4E5A" stroke-width="3.5" opacity="0.8">
      <path d="M120,436 h108 M126,412 h96 M140,390 h68 M174,368 v102"/>
    </g>
    <g fill="#2A4E5A"><rect x="124" y="470" width="10" height="96" rx="5"/><rect x="214" y="470" width="10" height="96" rx="5"/></g>

    <path d="M428,470 v-58 a58,58 0 0 1 116,0 v58 z" fill="#EBD3AC" stroke="#2A4E5A" stroke-width="6"/>
    <g fill="none" stroke="#2A4E5A" stroke-width="3.5" opacity="0.8">
      <path d="M432,436 h108 M438,412 h96 M452,390 h68 M486,368 v102"/>
    </g>
    <g fill="#2A4E5A"><rect x="436" y="470" width="10" height="96" rx="5"/><rect x="526" y="470" width="10" height="96" rx="5"/></g>
  </g>

  <!-- cups -->
  <g stroke="#2A4E5A" stroke-width="5" fill="#FFFFFF">
    <path d="M268,438 h50 v20 a25,25 0 0 1 -50,0 z"/>
    <path d="M342,438 h50 v20 a25,25 0 0 1 -50,0 z"/>
  </g>

  <!-- plant -->
  <path d="M792,566 h72 l-12,-72 h-48 z" fill="#F58A3C" stroke="#2A4E5A" stroke-width="6"/>
  <g fill="#8FC1A7" stroke="#2A4E5A" stroke-width="5">
    <ellipse cx="806" cy="452" rx="17" ry="42" transform="rotate(-22 806 452)"/>
    <ellipse cx="850" cy="452" rx="17" ry="42" transform="rotate(22 850 452)"/>
    <ellipse cx="828" cy="428" rx="17" ry="50"/>
  </g>
  <rect width="900" height="600" filter="url(#g)" opacity="0.05" style="mix-blend-mode:overlay"/>
